<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Burger Wheels</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    #palco { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* moldura retrato 9:16 que cabe na janela */
    #moldura { position: relative; aspect-ratio: 9 / 16; height: min(100vh, 177.78vw); width: auto; max-width: 100vw;
               border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 10px #23242e, 0 0 0 12px #3a3b48; background: #000; }
    #unity-canvas { width: 100%; height: 100%; display: block; }
    #carregando { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #12131a; }
    #carregando h1 { margin: 0; font-size: 34px; letter-spacing: 1px; color: #ffb300; display: none; }
    #carregando p { margin: 0; opacity: .8; font-size: 15px; }
    #logo { width: 62%; max-width: 420px; animation: pulsar 1.6s ease-in-out infinite; filter: drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
    @keyframes pulsar { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.03); } }
    #barra { width: 48%; height: 6px; background: #2a2b36; border-radius: 6px; overflow: hidden; }
    #barra div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb300, #ff6d00); transition: width .2s; }
    #aviso { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 12px; opacity: .5; }
    @media (max-aspect-ratio: 9/16) { #moldura { border-radius: 0; box-shadow: none; } #aviso { display: none; } }
  </style>
</head>
<body>
  <div id="palco">
    <div id="moldura">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="carregando">
        <img id="logo" src="logo.png" alt="Burger Wheels">
        <h1>Burger Wheels</h1>
        <div id="barra"><div id="progresso"></div></div>
        <p id="status">Carregando…</p>
      </div>
    </div>
  </div>
  <div id="aviso">Setas ou A/D trocam de pista · W abaixa a cabeça · S empina · Shift acelera · Espaço propulsor · no celular, deslize</div>
  <script src="Build/WebGL.loader.js?v=20260912.0019"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/WebGL.data.unityweb?v=20260912.0019",
      frameworkUrl: "Build/WebGL.framework.js.unityweb?v=20260912.0019",
      codeUrl: "Build/WebGL.wasm.unityweb?v=20260912.0019",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AGO",
      productName: "Burger Wheels",
      productVersion: "20260912.0019",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#progresso").style.width = Math.round(p * 100) + "%";
      document.querySelector("#status").textContent = p < 1 ? "Carregando… " + Math.round(p * 100) + "%" : "Iniciando…";
    }).then(function (unityInstance) {
      document.querySelector("#carregando").style.display = "none";
    }).catch(function (message) {
      document.querySelector("#status").textContent = "Erro: " + message;
    });
  </script>
</body>
</html>
